[package]
name = "macropad-obs"
version = "0.1.0"
edition = "2021"
# app_core (espflash 4.7.0) sets 1.95.
rust-version = "1.95"
license = "MIT"
publish = false
description = "Tauri shell for the macropad-obs CDC pad. The window crate is not part of just test."

[dependencies]
app_core = { path = "../../host/app_core" }
# The same obs_core app_core builds on: the app takes the workspace crate, never a copy (task 1.2).
obs_core = { path = "../../host/obs_core" }
serde_json = "1"
serialport = "4.10"
tauri = "2"

[build-dependencies]
tauri-build = "2"
