[package]
name = "macropad-obs"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Tauri shell for the macropad-obs CDC pad. The window crate is not part of just test."

[dependencies]
futures-util = "0.3"
obs_core = { path = "../../host" }
obws = { version = "0.15.0", features = ["events", "tls"] }
serde = { version = "1", features = ["derive"] }
serialport = "4.7"
tauri = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
tauri-build = "2"
