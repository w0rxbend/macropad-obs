<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>macropad-obs</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      background: #161616;
      color: #e6e2dc;
      font: 15px/1.4 ui-sans-serif, system-ui, sans-serif;
    }
    main { display: grid; gap: 16px; padding: 20px; max-width: 960px; }
    section { background: #222; border: 1px solid #3a3a3a; padding: 12px 14px; }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
    h2 { font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 8px; color: #b7b1a8; }
    label { display: grid; gap: 4px; font-size: 13px; }
    input, select, button { font: inherit; background: #111; color: inherit; border: 1px solid #555; padding: 6px 8px; }
    button { cursor: pointer; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .key { min-height: 72px; display: grid; align-content: space-between; }
    .key.on { border-color: #ff3b30; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
    li button { width: 100%; text-align: left; }
    .muted { color: #9a938a; }
  </style>
</head>
<body>
<main>
  <h1>macropad-obs</h1>
  <section>
    <h2>Connection</h2>
    <form id="conn" class="row">
      <label>URL <input id="url" name="url" value="ws://127.0.0.1:4455" autocomplete="off"></label>
      <label>Password <input id="password" name="password" type="password" autocomplete="current-password"></label>
      <label><span>Allow OBS on another machine</span>
        <input id="remote" type="checkbox"></label>
      <button type="submit">Save</button>
      <button type="button" id="connect">Connect</button>
      <button type="button" id="disconnect">Disconnect</button>
    </form>
    <p id="status" class="muted"></p>
  </section>
  <section>
    <h2>Scenes</h2>
    <ul id="scenes"></ul>
  </section>
  <section>
    <h2>Inputs</h2>
    <ul id="inputs"></ul>
  </section>
  <section>
    <h2>Keys</h2>
    <div id="keys" class="grid"></div>
  </section>
  <section>
    <h2>Profile</h2>
    <div class="row">
      <select id="profile"></select>
      <button type="button" id="use-profile">Use profile</button>
    </div>
  </section>
</main>
<script>
const actions = ["scene", "mute", "transition", "stream", "record", "profile_next", "profile_prev"];
const invoke = (cmd, args = {}) => window.__TAURI__.core.invoke(cmd, args);

function option(value, label, selected) {
  const node = document.createElement("option");
  node.value = value;
  node.textContent = label;
  node.selected = selected;
  return node;
}

async function refresh() {
  const state = await invoke("get_state");
  document.querySelector("#url").value = state.url;
  document.querySelector("#remote").checked = state.allow_non_loopback;
  const status = document.querySelector("#status");
  const latency = state.latency_ms == null ? "" : ` last key ${state.latency_ms} ms`;
  status.textContent = `${state.connected ? "connected" : "down"} ${state.profile}${latency}`;
  const scenes = document.querySelector("#scenes");
  scenes.replaceChildren(...state.scenes.map((name) => {
    const li = document.createElement("li");
    li.textContent = name;
    return li;
  }));
  const inputs = document.querySelector("#inputs");
  inputs.replaceChildren(...state.inputs.map((input) => {
    const li = document.createElement("li");
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = `${input.name}  ${input.muted ? "muted" : "open"}  ${input.db} dB`;
    button.addEventListener("click", () => invoke("select_input", { name: input.name }).then(refresh));
    li.append(button);
    return li;
  }));
  const keys = document.querySelector("#keys");
  keys.replaceChildren(...state.slots.map((slot, index) => {
    const box = document.createElement("div");
    box.className = slot.program ? "key on" : "key";
    const name = document.createElement("div");
    name.textContent = slot.name || "empty";
    const select = document.createElement("select");
    actions.forEach((action) => select.append(option(action, action, action === state.keys[index])));
    select.addEventListener("change", () => {
      invoke("set_key", { index, action: select.value }).then(refresh);
    });
    box.append(name, select);
    return box;
  }));
  const profile = document.querySelector("#profile");
  profile.replaceChildren(...state.profiles.map((name) => option(name, name, name === state.profile)));
}

document.querySelector("#conn").addEventListener("submit", (event) => {
  event.preventDefault();
  invoke("set_connection", {
    url: document.querySelector("#url").value,
    password: document.querySelector("#password").value,
    allow_non_loopback: document.querySelector("#remote").checked,
  }).then(() => {
    document.querySelector("#password").value = "";
    return refresh();
  });
});
document.querySelector("#connect").addEventListener("click", () => invoke("connect").then(refresh));
document.querySelector("#disconnect").addEventListener("click", () => invoke("disconnect").then(refresh));
document.querySelector("#use-profile").addEventListener("click", () => {
  invoke("set_profile", { name: document.querySelector("#profile").value }).then(refresh);
});
refresh().catch(() => {
  document.querySelector("#status").textContent = "shell idle";
});
</script>
</body>
</html>
